interface:
  display_name: "IP-Proposal"
  short_description: "Investigate PRC IP cases with browser and QCC evidence"
  default_prompt: "Use $ip-proposal to investigate the target through native QCC MCP/CLI, Xiaohongshu and Weibo MCPs, visible Chrome DevTools or Playwright MCP, native/OpenClaw browser control, or permitted Computer Use. Keep access logs in working notes, quantify damages from actual units and prices, and deliver a DOCX only after both report audits pass."
dependencies:
  tools:
    - type: "mcp"
      value: "qcc-company"
      description: "Qichacha company registration, shareholder, controller, and personnel data"
      transport: "streamable_http"
      url: "https://agent.qcc.com/mcp/company/stream"
    - type: "mcp"
      value: "qcc-ipr"
      description: "Qichacha trademark, patent, copyright, online-store, and account data"
      transport: "streamable_http"
      url: "https://agent.qcc.com/mcp/ipr/stream"
    - type: "mcp"
      value: "qcc-operation"
      description: "Qichacha operating and business qualification data"
      transport: "streamable_http"
      url: "https://agent.qcc.com/mcp/operation/stream"
    - type: "mcp"
      value: "qcc-risk"
      description: "Qichacha judicial, regulatory, enforcement, and collectability risk data"
      transport: "streamable_http"
      url: "https://agent.qcc.com/mcp/risk/stream"
    - type: "mcp"
      value: "qcc-executive"
      description: "Qichacha anchored executive and related-company data"
      transport: "streamable_http"
      url: "https://agent.qcc.com/mcp/executive/stream"
    - type: "mcp"
      value: "xiaohongshu"
      description: "Local Xiaohongshu note, profile, image, engagement, and visible login investigation"
      transport: "streamable_http"
      url: "http://127.0.0.1:18060/mcp"
    - type: "mcp"
      value: "weibo"
      description: "Weibo content, user, topic, feed, comment, and engagement investigation"
    - type: "mcp"
      value: "chrome-devtools"
      description: "Visible persistent Chrome navigation, DOM/network inspection, screenshots, and login handoff"
    - type: "mcp"
      value: "playwright"
      description: "Headed persistent Chrome automation, screenshots, snapshots, network logs, and login handoff"
